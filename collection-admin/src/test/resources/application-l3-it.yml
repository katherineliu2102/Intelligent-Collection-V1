spring:
  config:
    import: "optional:nacos:"
  cloud:
    nacos:
      config:
        enabled: false
  datasource:
    url: ${L3_IT_DB_URL}
    username: ${L3_IT_DB_USER}
    password: ${L3_IT_DB_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
    jdbc-type-for-null: "NULL"

collection:
  eventbus: memory
  idempotency: memory
  ingestion:
    enabled: false
  scan:
    # 本 IT 连的是共享库，别的实例也在扫同一批表。收窄到本用例自己的案件，
    # 否则扫描会捞到无关步骤，断言随他人数据漂移。
    case-id-whitelist: 99009980,99009981

channel:
  fallback-to-mock: true

engine:
  spi:
    timeout-enabled: false
  consumer:
    thread-pool-size: 2
    queue-capacity: 32
  decision-log:
    enabled: false
