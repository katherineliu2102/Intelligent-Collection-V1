upstream ups_collection {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
}

server {
    listen      80;
    listen      443 ssl;
    server_name collection-admin.mocasa.com;
    root /opt/tmp;

    access_log /var/log/nginx/collection-admin.mocasa.com_access.log main;
    error_log /var/log/nginx/collection-admin.mocasa.com_error.log;
    server_tokens off;

    ssl_certificate      /etc/nginx/ssl/collection-admin.mocasa.com.pem;
    ssl_certificate_key  /etc/nginx/ssl/collection-admin.mocasa.com.key;
    ssl_session_cache    shared:SSL:1m;
    ssl_session_timeout  5m;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers  on;

    proxy_headers_hash_max_size 51200;
    proxy_headers_hash_bucket_size 6400;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
    }

    # 只有第三方回调需要公网入口：Valubo AI_CALL、通知平台、SendGrid Event Webhook。
    # 三者都在应用侧验签（HMAC / ECDSA），nginx 只做路径收口，不做鉴权。
    location ^~ /webhook/ {
        # 回调报文是小 JSON。全局 500M 对这里没有意义，只会放大打空请求的成本。
        client_max_body_size 1m;

        proxy_pass http://ups_collection;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 其余一律拒绝。此前这里是 location / { proxy_pass ... }，把管理面
    # （/ops、/cases、/compliance、/admin、/config）与 /actuator 一起挂到了公网：
    # 管理面登录是开发态实现，任意用户名即得 SYSTEM_ADMIN，等于把债务人 PII 与
    # DLQ 重放（可驱动真实触达）敞开给互联网（台账 F8）。运维改走 SSH 隧道：
    #   ssh -L 8080:127.0.0.1:8080 ubuntu@<pilot-host>
    # 返回 403 而非 404：让"端口开着但这条路径不对外"与"应用没起来"在排查时可区分。
    location / {
        return 403;
    }
}
